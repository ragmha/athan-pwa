name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one deployment at a time, and let a newer push supersede a queued one
# rather than cancelling a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # The same gate used locally: typecheck, lint and tests. A broken build
      # must never reach Pages, where it would be cached by the service worker.
      - run: bun run check

      - run: bun run build

      # GitHub Pages serves 404.html for any unknown path. Because this is a
      # client-routed SPA, that file has to be the app itself, or a reload on
      # /qibla would land on GitHub's error page.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
